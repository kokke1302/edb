<svg viewBox="0 0 1700 480" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Sans','Yu Gothic',sans-serif">
  <defs>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1f2328;
        --stroke: #1f2328;
        --stroke2: #1f2328;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #22272e;
          --fg: #adbac7;
          --stroke: #adbac7;
          --stroke2: #768390;
        }
      }
      svg { background: var(--bg); }
      .bg-rect { fill: var(--bg); }
      .box { fill: var(--bg); stroke: var(--stroke); }
      .box-inner { fill: none; stroke: var(--stroke2); }
      .divider { stroke: var(--stroke2); }
      .txt { fill: var(--fg); }
      .line { stroke: var(--stroke); }
      .legend-outer { fill: var(--bg); stroke: var(--stroke); }
      .legend-inner { fill: none; stroke: var(--stroke); }
      .group-line { stroke: var(--stroke2); }
      .arrowhead { fill: var(--stroke); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg-rect" x="0" y="0" width="1700" height="480"/>

  <!-- ============ LEGEND ============ -->
  <g id="legend">
    <rect class="legend-outer" x="1500" y="12" width="18" height="18" stroke-width="1.5"/>
    <rect class="legend-inner" x="1503" y="15" width="12" height="12" stroke-width="1"/>
    <text class="txt" x="1524" y="26" font-size="15">は provider</text>
  </g>

  <!-- ============ BOXES ============ -->

  <!-- UI -->
  <g id="box-ui">
    <rect class="box" x="30" y="150" width="100" height="90" stroke-width="2"/>
    <text class="txt" x="80" y="202" font-size="20" text-anchor="middle">UI</text>
  </g>

  <!-- view model -->
  <g id="box-viewmodel">
    <rect class="box" x="210" y="60" width="210" height="270" stroke-width="2.5"/>
    <rect class="box-inner" x="216" y="66" width="198" height="258" stroke-width="1"/>
    <line class="divider" x1="210" y1="150" x2="420" y2="150" stroke-width="1"/>
    <line class="divider" x1="210" y1="240" x2="420" y2="240" stroke-width="1"/>
    <text class="txt" x="315" y="112" font-size="16" text-anchor="middle">イベントハンドラ</text>
    <text class="txt" x="315" y="202" font-size="16" text-anchor="middle">コントローラ</text>
    <text class="txt" x="315" y="292" font-size="16" text-anchor="middle">状態</text>
  </g>

  <!-- use case -->
  <g id="box-usecase">
    <rect class="box" x="490" y="60" width="210" height="270" stroke-width="2.5"/>
    <rect class="box-inner" x="496" y="66" width="198" height="258" stroke-width="1"/>
    <line class="divider" x1="490" y1="150" x2="700" y2="150" stroke-width="1"/>
    <line class="divider" x1="490" y1="240" x2="700" y2="240" stroke-width="1"/>
    <text class="txt" x="595" y="112" font-size="16" text-anchor="middle">メソッド</text>
    <text class="txt" x="595" y="202" font-size="16" text-anchor="middle">ロジック</text>
    <text class="txt" x="595" y="292" font-size="16" text-anchor="middle">return</text>
  </g>

  <!-- repository interface -->
  <g id="box-repository">
    <rect class="box" x="780" y="60" width="210" height="180" stroke-width="2.5"/>
    <rect class="box-inner" x="786" y="66" width="198" height="168" stroke-width="1"/>
    <line class="divider" x1="780" y1="150" x2="990" y2="150" stroke-width="1"/>
    <line class="divider" x1="780" y1="240" x2="990" y2="240" stroke-width="1"/>
    <text class="txt" x="885" y="122" font-size="16" text-anchor="middle">メソッド</text>
    <text class="txt" x="885" y="202" font-size="16" text-anchor="middle">return</text>
  </g>

  <!-- mapper -->
  <g id="box-mapper">
    <rect class="box" x="1070" y="240" width="140" height="90" stroke-width="2"/>
    <text class="txt" x="1140" y="292" font-size="16" text-anchor="middle">static</text>
  </g>

  <!-- repository impl -->
  <g id="box-repositoryimpl">
    <rect class="box" x="1290" y="60" width="210" height="270" stroke-width="2"/>
    <line class="divider" x1="1290" y1="150" x2="1500" y2="150" stroke-width="1"/>
    <line class="divider" x1="1290" y1="240" x2="1500" y2="240" stroke-width="1"/>
    <text class="txt" x="1395" y="112" font-size="16" text-anchor="middle">メソッド</text>
    <text class="txt" x="1395" y="202" font-size="16" text-anchor="middle">ロジック</text>
    <text class="txt" x="1395" y="292" font-size="16" text-anchor="middle">return</text>
  </g>

  <!-- DB -->
  <g id="box-db">
    <rect class="box" x="1540" y="150" width="100" height="90" stroke-width="2"/>
    <text class="txt" x="1590" y="202" font-size="20" text-anchor="middle">DB</text>
  </g>

  <!-- ============ ARROWS ============ -->
  <g id="arrows-forward" class="line" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="130"  y1="177" x2="207"  y2="105"/>
    <line x1="420"  y1="177" x2="487"  y2="105"/>
    <line x1="700"  y1="177" x2="777"  y2="105"/>
    <line x1="990"  y1="105" x2="1287" y2="105"/>
    <line x1="1500" y1="177" x2="1537" y2="177"/>
  </g>

  <g id="arrows-backward" class="line" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="1540" y1="213" x2="1503" y2="213"/>
    <line x1="1290" y1="285" x2="1213" y2="285"/>
    <line x1="1070" y1="285" x2="993"  y2="213"/>
    <line x1="780"  y1="213" x2="703"  y2="213"/>
    <line x1="490"  y1="285" x2="423"  y2="213"/>
    <line x1="210"  y1="285" x2="133"  y2="213"/>
  </g>

  <!-- ============ LABELS BELOW BOXES ============ -->
  <g id="box-labels" class="txt" font-size="15" text-anchor="middle">
    <text x="315" y="350">view model</text>
    <text x="595" y="350">use case</text>
    <text x="885" y="350">リポジトリAbst</text>
    <text x="1140" y="350">mapper</text>
    <text x="1395" y="350">リポジトリImpl</text>
  </g>

  <!-- ============ BOTTOM GROUPING (layers) ============ -->
  <g id="layer-groups" class="group-line" stroke-width="1">
    <line x1="30"   y1="410" x2="420"  y2="410"/>
    <line x1="490"  y1="410" x2="990"  y2="410"/>
    <line x1="1070" y1="410" x2="1640" y2="410"/>
  </g>
  <g id="layer-labels" class="txt" font-size="16" text-anchor="middle">
    <text x="225"  y="432">presentation</text>
    <text x="740"  y="432">domain</text>
    <text x="1355" y="432">data</text>
  </g>
</svg>