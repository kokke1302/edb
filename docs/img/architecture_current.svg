<svg viewBox="0 0 1700 480" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Sans','Yu Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1700" height="480" fill="#ffffff"/>

  <!-- ============ LEGEND ============ -->
  <g id="legend">
    <rect x="1500" y="12" width="18" height="18" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <rect x="1503" y="15" width="12" height="12" fill="none" stroke="#000" stroke-width="1"/>
    <text x="1524" y="26" font-size="15">は provider</text>
  </g>

  <!-- ============ BOXES ============ -->

  <!-- UI -->
  <g id="box-ui">
    <rect x="30" y="150" width="100" height="90" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="80" y="202" font-size="20" text-anchor="middle">UI</text>
  </g>

  <!-- view model -->
  <g id="box-viewmodel">
    <rect x="210" y="60" width="210" height="270" fill="#fff" stroke="#000" stroke-width="2.5"/>
    <rect x="216" y="66" width="198" height="258" fill="none" stroke="#000" stroke-width="1"/>
    <line x1="210" y1="150" x2="420" y2="150" stroke="#000" stroke-width="1"/>
    <line x1="210" y1="240" x2="420" y2="240" stroke="#000" stroke-width="1"/>
    <text x="315" y="112" font-size="16" text-anchor="middle">イベントハンドラ</text>
    <text x="315" y="202" font-size="16" text-anchor="middle">コントローラ</text>
    <text x="315" y="292" font-size="16" text-anchor="middle">状態</text>
  </g>

  <!-- use case -->
  <g id="box-usecase">
    <rect x="490" y="60" width="210" height="270" fill="#fff" stroke="#000" stroke-width="2.5"/>
    <rect x="496" y="66" width="198" height="258" fill="none" stroke="#000" stroke-width="1"/>
    <line x1="490" y1="150" x2="700" y2="150" stroke="#000" stroke-width="1"/>
    <line x1="490" y1="240" x2="700" y2="240" stroke="#000" stroke-width="1"/>
    <text x="595" y="112" font-size="16" text-anchor="middle">メソッド</text>
    <text x="595" y="202" font-size="16" text-anchor="middle">ロジック</text>
    <text x="595" y="292" font-size="16" text-anchor="middle">return</text>
  </g>

  <!-- repository interface -->
  <g id="box-repository">
    <rect x="780" y="60" width="210" height="180" fill="#fff" stroke="#000" stroke-width="2.5"/>
    <rect x="786" y="66" width="198" height="168" fill="none" stroke="#000" stroke-width="1"/>
    <line x1="780" y1="150" x2="990" y2="150" stroke="#000" stroke-width="1"/>
    <line x1="780" y1="240" x2="990" y2="240" stroke="#000" stroke-width="1"/>
    <text x="885" y="122" font-size="16" text-anchor="middle">メソッド</text>
    <text x="885" y="202" font-size="16" text-anchor="middle">return</text>
  </g>

  <!-- mapper -->
  <g id="box-mapper">
    <rect x="1070" y="240" width="140" height="90" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="1140" y="292" font-size="16" text-anchor="middle">static</text>
  </g>

  <!-- repository impl -->
  <g id="box-repositoryimpl">
    <rect x="1290" y="60" width="210" height="270" fill="#fff" stroke="#000" stroke-width="2"/>
    <line x1="1290" y1="150" x2="1500" y2="150" stroke="#000" stroke-width="1"/>
    <line x1="1290" y1="240" x2="1500" y2="240" stroke="#000" stroke-width="1"/>
    <text x="1395" y="112" font-size="16" text-anchor="middle">メソッド</text>
    <text x="1395" y="202" font-size="16" text-anchor="middle">ロジック</text>
    <text x="1395" y="292" font-size="16" text-anchor="middle">return</text>
  </g>

  <!-- DB -->
  <g id="box-db">
    <rect x="1540" y="150" width="100" height="90" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="1590" y="202" font-size="20" text-anchor="middle">DB</text>
  </g>

  <!-- ============ ARROWS ============ -->
  <g id="arrows-forward" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="130"  y1="177" x2="207"  y2="105"/>
    <line x1="420"  y1="177" x2="487"  y2="105"/>
    <line x1="700"  y1="177" x2="777"  y2="105"/>
    <line x1="990"  y1="105" x2="1287" y2="105"/>
    <line x1="1500" y1="177" x2="1537" y2="177"/>
  </g>

  <g id="arrows-backward" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="1540" y1="213" x2="1503" y2="213"/>
    <line x1="1290" y1="285" x2="1213" y2="285"/>
    <line x1="1070" y1="285" x2="993"  y2="213"/>
    <line x1="780"  y1="213" x2="703"  y2="213"/>
    <line x1="490"  y1="285" x2="423"  y2="213"/>
    <line x1="210"  y1="285" x2="133"  y2="213"/>
  </g>

  <!-- ============ LABELS BELOW BOXES ============ -->
  <g id="box-labels" font-size="15" text-anchor="middle">
    <text x="315" y="350">view model</text>
    <text x="595" y="350">use case</text>
    <text x="885" y="350">リポジトリAbst</text>
    <text x="1140" y="350">mapper</text>
    <text x="1395" y="350">リポジトリImpl</text>
  </g>

  <!-- ============ BOTTOM GROUPING (layers) ============ -->
  <g id="layer-groups" stroke="#000" stroke-width="1">
    <line x1="30"   y1="410" x2="420"  y2="410"/>
    <line x1="490"  y1="410" x2="990"  y2="410"/>
    <line x1="1070" y1="410" x2="1640" y2="410"/>
  </g>
  <g id="layer-labels" font-size="16" text-anchor="middle">
    <text x="225"  y="432">presentation</text>
    <text x="740"  y="432">domain</text>
    <text x="1355" y="432">data</text>
  </g>
</svg>