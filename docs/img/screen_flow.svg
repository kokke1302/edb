<svg viewBox="0 0 1300 780" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Sans','Yu Gothic','Meiryo',sans-serif">
  <defs>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1f2328;
        --stroke: #1f2328;
        --stroke2: #768390;
        --accent: #0969da;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #22272e;
          --fg: #adbac7;
          --stroke: #adbac7;
          --stroke2: #768390;
          --accent: #539bf5;
        }
      }
      svg { background: var(--bg); }
      .bg-rect { fill: var(--bg); }
      .box { fill: var(--bg); stroke: var(--stroke); stroke-width: 2; }
      .box-main { fill: var(--bg); stroke: var(--stroke); stroke-width: 2.5; }
      .box-inner { fill: none; stroke: var(--stroke2); stroke-width: 1; }
      .box-modal { fill: var(--bg); stroke: var(--stroke); stroke-width: 2; stroke-dasharray: 6 4; }
      .txt { fill: var(--fg); }
      .txt-sub { fill: var(--stroke2); }
      .line { fill: none; stroke: var(--stroke); stroke-width: 1.5; }
      .arrowhead { fill: var(--stroke); }
      .label { font-size: 12px; fill: var(--fg); text-anchor: middle; }
      .label-bg { fill: var(--bg); }
      .section-label { font-size: 13px; fill: var(--stroke2); font-weight: bold; }
      .section-line { stroke: var(--stroke2); stroke-dasharray: 4 4; stroke-width: 1; opacity: 0.5; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect class="bg-rect" x="0" y="0" width="1300" height="780"/>

  <!-- ============ SECTION DIVIDERS ============ -->
  <g id="sections">
    <line class="section-line" x1="40" y1="240" x2="1260" y2="240" />
    <line class="section-line" x1="40" y1="500" x2="1260" y2="500" />
    <text class="section-label" x="50" y="35">モーダル / 編集タスク領域</text>
    <text class="section-label" x="50" y="275">コア画面領域（ボトムナビゲーション）</text>
    <text class="section-label" x="50" y="535">サブメニュー / 設定領域</text>
  </g>

  <!-- ============ CONNECTIONS / ARROWS ============ -->
  <g id="connections" class="line" marker-end="url(#arrow)">

    <!-- [中段] Translate <-> Book (ボトムナビ切替) -->
    <path d="M 450,345 L 650,345" marker-start="url(#arrow)" />

    <!-- [中段] Translate -> [上段] Dict (単語ブロックをタップ) -->
    <path d="M 300,300 L 300,140" />

    <!-- [上段] Dict -> [中段] Translate (画面外をタップ) -->
    <path d="M 400,140 L 400,300" />

    <!-- [上段] Dict -> [上段] Register (候補を編集: 編集) -->
    <path d="M 450,75 L 650,75" />

    <!-- [上段] Dict -> [上段] Register (オリジナルを登録: 新規登録) -->
    <path d="M 450,115 L 650,115" />

    <!-- [中段] Book -> [上段] Register (FAB: 新規登録) -->
    <path d="M 700,300 L 700,140" />

    <!-- [中段] Book -> [上段] Register (カードをタップ: 編集) -->
    <path d="M 800,300 L 800,140" />

    <!-- [上段] Register -> [中段] Back (保存・キャンセル・削除) -->
    <path d="M 850,95 L 1150,95 L 1150,300" />

    <!-- [中段] Translate -> [下段] Drawer (Drawerを開く) -->
    <path d="M 300,390 L 300,540" />

    <!-- [下段] Drawer -> [中段] Translate (履歴タイルをタップ) -->
    <path d="M 400,540 L 400,390" />

    <!-- [下段] Drawer -> [下段] Setting (設定を開く) -->
    <path d="M 450,555 L 650,555" />

    <!-- [下段] Drawer -> [下段] Help (ヘルプを開く) -->
    <path d="M 450,605 L 550,605 L 550,665 L 650,665" />

    <!-- [下段] Setting -> [中段] Back (閉じる) -->
    <path d="M 850,555 L 1100,555 L 1100,390" />

    <!-- [下段] Help -> [中段] Back (閉じる) -->
    <path d="M 850,665 L 1150,665 L 1150,390" />

  </g>

  <!-- ============ LABELS ============ -->
  <g id="arrow-labels">
    <!-- Translate <-> Book -->
    <rect class="label-bg" x="490" y="335" width="120" height="20" rx="3"/>
    <text class="label" x="550" y="349">ボトムナビ切替</text>

    <!-- Translate -> Dict (上段に配置) -->
    <rect class="label-bg" x="235" y="195" width="130" height="20" rx="3"/>
    <text class="label" x="300" y="209">単語ブロックをタップ</text>

    <!-- Dict -> Translate (上段に配置) -->
    <rect class="label-bg" x="350" y="160" width="100" height="20" rx="3"/>
    <text class="label" x="400" y="174">画面外をタップ</text>

    <!-- Dict -> Register (上: 候補を編集) -->
    <text class="label" x="550" y="63">候補を編集: 編集</text>

    <!-- Dict -> Register (下: オリジナルを登録) -->
    <text class="label" x="550" y="135">オリジナルを登録: 新規登録</text>

    <!-- Book -> Register (FAB: 上段に配置) -->
    <rect class="label-bg" x="655" y="160" width="90" height="20" rx="3"/>
    <text class="label" x="700" y="174" font-size="11">FAB: 新規登録</text>

    <!-- Book -> Register (Edit: 上段に配置) -->
    <rect class="label-bg" x="738" y="195" width="124" height="20" rx="3"/>
    <text class="label" x="800" y="209" font-size="11">カードをタップ: 編集</text>

    <!-- Register -> Back -->
    <rect class="label-bg" x="928" y="85" width="144" height="20" rx="3"/>
    <text class="label" x="1000" y="99">保存・キャンセル・削除</text>

    <!-- Translate -> Drawer (中段に配置) -->
    <rect class="label-bg" x="250" y="415" width="100" height="20" rx="3"/>
    <text class="label" x="300" y="429">Drawerを開く</text>

    <!-- Drawer -> Translate (中段に配置) -->
    <rect class="label-bg" x="338" y="455" width="124" height="20" rx="3"/>
    <text class="label" x="400" y="469">履歴タイルをタップ</text>

    <!-- Drawer -> Setting -->
    <rect class="label-bg" x="510" y="545" width="80" height="20" rx="3"/>
    <text class="label" x="550" y="559">設定を開く</text>

    <!-- Drawer -> Help (2番目の垂直線上) -->
    <rect class="label-bg" x="510" y="625" width="80" height="20" rx="3"/>
    <text class="label" x="550" y="639">ヘルプを開く</text>

    <!-- Setting -> Back -->
    <rect class="label-bg" x="945" y="545" width="60" height="20" rx="3"/>
    <text class="label" x="975" y="559">閉じる</text>

    <!-- Help -> Back -->
    <rect class="label-bg" x="970" y="655" width="60" height="20" rx="3"/>
    <text class="label" x="1000" y="669">閉じる</text>
  </g>

  <!-- ============ BOXES / NODES ============ -->

  <g id="node-dict">
    <rect class="box-modal" x="250" y="50" width="200" height="90" rx="6"/>
    <text class="txt" x="350" y="88" font-size="15" font-weight="bold" text-anchor="middle">Modal</text>
    <text class="txt" x="350" y="110" font-size="13" text-anchor="middle">内部辞書シート</text>
  </g>

  <g id="node-register">
    <rect class="box" x="650" y="50" width="200" height="90" rx="4"/>
    <text class="txt" x="750" y="88" font-size="16" font-weight="bold" text-anchor="middle">/registration</text>
    <text class="txt" x="750" y="112" font-size="14" text-anchor="middle">登録画面</text>
  </g>

  <g id="node-translate">
    <rect class="box-main" x="250" y="300" width="200" height="90"/>
    <rect class="box-inner" x="255" y="305" width="190" height="80"/>
    <text class="txt" x="350" y="338" font-size="16" font-weight="bold" text-anchor="middle">/translate</text>
    <text class="txt" x="350" y="362" font-size="14" text-anchor="middle">翻訳モード画面</text>
  </g>

  <g id="node-book">
    <rect class="box-main" x="650" y="300" width="200" height="90"/>
    <rect class="box-inner" x="655" y="305" width="190" height="80"/>
    <text class="txt" x="750" y="338" font-size="16" font-weight="bold" text-anchor="middle">/words</text>
    <text class="txt" x="750" y="362" font-size="14" text-anchor="middle">単語帳モード画面</text>
  </g>

  <g id="node-back">
    <rect class="box-main" x="1050" y="300" width="200" height="90"/>
    <rect class="box-inner" x="1055" y="305" width="190" height="80"/>
    <text class="txt" x="1150" y="352" font-size="15" font-weight="bold" text-anchor="middle">元の画面へ戻る</text>
  </g>

  <g id="node-drawer">
    <rect class="box-modal" x="250" y="540" width="200" height="90" rx="4"/>
    <text class="txt" x="350" y="578" font-size="15" font-weight="bold" text-anchor="middle">Drawer</text>
    <text class="txt" x="350" y="600" font-size="13" text-anchor="middle">英文履歴一覧</text>
  </g>

  <g id="node-setting">
    <rect class="box" x="650" y="520" width="200" height="70" rx="4"/>
    <text class="txt" x="750" y="548" font-size="15" font-weight="bold" text-anchor="middle">/setting</text>
    <text class="txt" x="750" y="568" font-size="13" text-anchor="middle">設定画面</text>
  </g>

  <g id="node-help">
    <rect class="box" x="650" y="630" width="200" height="70" rx="4"/>
    <text class="txt" x="750" y="658" font-size="15" font-weight="bold" text-anchor="middle">/help</text>
    <text class="txt" x="750" y="678" font-size="13" text-anchor="middle">ヘルプ画面</text>
  </g>

</svg>
